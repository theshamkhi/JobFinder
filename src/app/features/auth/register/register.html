<div class="min-h-screen flex items-center justify-center px-4 py-12 bg-glow">
  <div class="absolute inset-0 bg-grid-pattern opacity-30 pointer-events-none"></div>

  <div class="w-full max-w-md relative">
    <div class="card p-8 shadow-2xl shadow-black/50 border-glow">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-accent-500 to-primary-600 shadow-lg shadow-accent-500/30 mb-4">
          <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
        </div>
        <h1 class="font-display text-2xl font-bold text-white">Create your account</h1>
        <p class="text-slate-500 mt-1 text-sm">Start finding your dream job today</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <!-- Name row -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="input-label">First Name</label>
            <input
              type="text"
              formControlName="firstName"
              placeholder="John"
              class="input-field"
              [class.border-red-500]="isInvalid('firstName')">
            <p *ngIf="isInvalid('firstName')" class="text-red-400 text-xs mt-1">Required</p>
          </div>
          <div>
            <label class="input-label">Last Name</label>
            <input
              type="text"
              formControlName="lastName"
              placeholder="Doe"
              class="input-field"
              [class.border-red-500]="isInvalid('lastName')">
            <p *ngIf="isInvalid('lastName')" class="text-red-400 text-xs mt-1">Required</p>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="input-label">Email address</label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="input-field"
            [class.border-red-500]="isInvalid('email')">
          <p *ngIf="isInvalid('email')" class="text-red-400 text-xs mt-1">{{ getError('email') }}</p>
        </div>

        <!-- Password -->
        <div>
          <label class="input-label">Password</label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Min. 8 characters"
              class="input-field pr-10"
              [class.border-red-500]="isInvalid('password')">
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
              <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
          <p *ngIf="isInvalid('password')" class="text-red-400 text-xs mt-1">{{ getError('password') }}</p>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="input-label">Confirm Password</label>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Repeat password"
            class="input-field"
            [class.border-red-500]="hasPasswordMismatch()">
          <p *ngIf="hasPasswordMismatch()" class="text-red-400 text-xs mt-1">Passwords do not match</p>
        </div>

        <!-- Error -->
        <div *ngIf="errorMessage()" class="flex items-center gap-2.5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          {{ errorMessage() }}
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="loading()" class="btn-primary w-full justify-center py-3 mt-1">
          <svg *ngIf="loading()" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span *ngIf="loading()">Creating account...</span>
          <span *ngIf="!loading()">Create Account</span>
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-6">
        Already have an account?
        <a routerLink="/auth/login" class="text-primary-400 hover:text-primary-300 font-medium ml-1">Sign in</a>
      </p>
    </div>
  </div>
</div>
