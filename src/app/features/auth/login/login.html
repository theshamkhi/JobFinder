<div class="min-h-screen flex items-center justify-center px-4 bg-glow">
  <!-- Background grid -->
  <div class="absolute inset-0 bg-grid-pattern opacity-30 pointer-events-none"></div>

  <div class="w-full max-w-md relative">
    <!-- Card -->
    <div class="card p-8 shadow-2xl shadow-black/50 border-glow">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 shadow-lg shadow-primary-500/30 mb-4">
          <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <h1 class="font-display text-2xl font-bold text-white">Welcome back</h1>
        <p class="text-slate-500 mt-1 text-sm">Sign in to your JobFinder account</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <!-- Email -->
        <div>
          <label class="input-label">Email address</label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="input-field"
            [class.border-red-500]="isInvalid('email')">
          <p *ngIf="isInvalid('email')" class="text-red-400 text-xs mt-1.5">{{ getError('email') }}</p>
        </div>

        <!-- Password -->
        <div>
          <label class="input-label">Password</label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              class="input-field pr-10"
              [class.border-red-500]="isInvalid('password')">
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
              <svg *ngIf="showPassword()" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
              <svg *ngIf="!showPassword()" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
          <p *ngIf="isInvalid('password')" class="text-red-400 text-xs mt-1.5">{{ getError('password') }}</p>
        </div>

        <!-- Error alert -->
        <div *ngIf="errorMessage()" class="flex items-center gap-2.5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          {{ errorMessage() }}
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="btn-primary w-full justify-center py-3 mt-1">
          <svg *ngIf="loading()" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span *ngIf="loading()">Signing in...</span>
          <span *ngIf="!loading()">Sign In</span>
        </button>
      </form>

      <!-- Footer -->
      <p class="text-center text-sm text-slate-500 mt-6">
        Don't have an account?
        <a routerLink="/auth/register" class="text-primary-400 hover:text-primary-300 font-medium transition-colors ml-1">Create one</a>
      </p>

      <!-- Demo hint -->
      <div class="mt-4 p-3 rounded-lg bg-white/3 border border-white/8">
        <p class="text-xs text-slate-500 text-center">
          Demo: <span class="text-slate-400 font-mono">demo&#64;jobfinder.com</span> / <span class="text-slate-400 font-mono">Demo1234!</span>
        </p>
      </div>
    </div>
  </div>
</div>
