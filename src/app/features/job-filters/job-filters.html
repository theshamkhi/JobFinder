<aside class="card p-4 h-fit">
  <h3 class="font-display font-semibold text-white text-sm mb-4 flex items-center gap-2">
    <svg class="w-4 h-4 text-primary-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
    </svg>
    Filters
  </h3>
  <div class="divider mb-4"></div>

  <!-- Sources -->
  <div class="mb-5">
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Sources</p>
    <div class="flex flex-col gap-2">
      <label class="flex items-center gap-2.5 cursor-pointer group">
        <input
          type="checkbox"
          [checked]="sourceFilters.themuse"
          (change)="onSourceFilterChange('themuse', $event)"
          class="rounded border-white/20 bg-white/5 text-primary-500 focus:ring-primary-500 focus:ring-offset-surface-900 cursor-pointer">
        <span class="text-sm text-slate-300 group-hover:text-white transition-colors">The Muse</span>
        <span class="ml-auto badge badge-primary text-[10px]">Global</span>
      </label>
      <label class="flex items-center gap-2.5 cursor-pointer group">
        <input
          type="checkbox"
          [checked]="sourceFilters.arbeitnow"
          (change)="onSourceFilterChange('arbeitnow', $event)"
          class="rounded border-white/20 bg-white/5 text-primary-500 focus:ring-primary-500 focus:ring-offset-surface-900 cursor-pointer">
        <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Arbeitnow</span>
        <span class="ml-auto badge badge-neutral text-[10px]">Europe</span>
      </label>
    </div>
  </div>

  <!-- Work type -->
  <div class="mb-5">
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Work Type</p>
    <label class="flex items-center gap-2.5 cursor-pointer group">
      <div class="relative">
        <input
          type="checkbox"
          [checked]="remoteFilter"
          (change)="onRemoteFilterChange($event)"
          class="sr-only peer">
        <div class="w-9 h-5 bg-white/10 peer-checked:bg-primary-600 rounded-full transition-colors duration-200 peer-focus:ring-2 peer-focus:ring-primary-500/30"></div>
        <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200 peer-checked:translate-x-4"></div>
      </div>
      <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Remote only</span>
    </label>
  </div>

  <!-- API info -->
  <div class="mt-6 pt-4 border-t border-white/8">
    <p class="text-xs text-slate-600 leading-relaxed">
      Results aggregated from selected sources, sorted by newest first.
    </p>
  </div>
</aside>
